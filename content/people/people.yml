- id: aziz-khan
  countries: ["NO","PK"]
  show_on_global_map: true
  publication_names: [Aziz Khan] # Verified author spelling; no fuzzy name matching.
  name: Aziz Khan
  role: pi
  position: Principal Investigator
  summary: Aziz is an Assistant Professor of Computational Biology at MBZUAI, leading the CBCRG Lab and focusing on gene regulation in diseases such as cancer.
  education: 'PhD, Tsinghua University, China'
  bio: |
    Aziz is an Assistant Professor of Computational Biology at [**MBZUAI**](https://mbzuai.ac.ae/study/faculty/aziz-khan/),
    leading the Computational Biology and Cancer Regulatory Genomics (**CBCRG**) Lab in Abu Dhabi. He has a PhD
    in Bioinformatics from Tsinghua University with [Xuegong Zhang](https://eca.xglab.tech/member/index.html) followed
    by a Postdoc at NCMM, University of Oslo with [Anthony Mathelier](https://mathelierlab.com/). His research bridges
    computational biology, genomics, epigenomics, machine learning, and software engineering to understand gene
    regulation in diseases such as cancer.

    Previously, Aziz was a senior research scientist at Stanford Cancer Institute, Stanford University with [Christina
    Curtis](https://med.stanford.edu/curtislab.html) where he led a bioinformatics team and developed scalable infrastructure
    for analyzing large-scale cancer multi-omic datasets. He contributed to major consortiums, including the [Human
    Tumor Atlas Network (HTAN)](https://humantumoratlas.org/) and the [Metastasis Research Network (MetNet)](https://www.cancer.gov/about-nci/organization/dcb/research-programs/metnet).
    At Stanford University he also served as an [Instructor](https://explorecourses.stanford.edu/instructor/azizk)
    for Stanford Biosciences to develop and teach a course on the art of reproducible science.

    He is a strong advocate for open, reproducible, and collaborative science. He has developed widely used bioinformatics
    [tools and resources](../pages/software.qmd) such as JASPAR, Intervene, dbSUPER, and UniBind, which have become
    essential resources in gene regulation. He is also a [Certified Instructor](https://carpentries.org/community/instructors/)
    for The Carpentries, providing hands-on training in software and genomics data science. He was an eLife and
    ASAPbio Community Ambassador and actively promoted preprints, open-science, and reproducibility.
  photo: assets/migrated/images/team/aziz.jpg
  links:
    google-scholar: https://scholar.google.com/citations?user=m23RfrcAAAAJ&sortby=pubdate
    home-page: https://mbzuai.ac.ae/study/faculty/aziz-khan/
    bluesky: https://bsky.app/profile/khanlab.bio
    github: https://github.com/asntech
  projects: []
  source_url: https://github.com/khan-lab/khan-lab.github.io/blob/62d3473e5aed3ea88c25e2d343b6c7c366a878ea/_members/aziz-khan.md
  orcid: 0000-0002-6459-6224
