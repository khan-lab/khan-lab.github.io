  summary: Akshat is a Research Engineer specializing in bioinformatics pipeline development, genomic data analysis, and machine learning applications in computational biology.
  bio: |
    Akshat is a Research Engineer in the Computational Biology and Cancer Regulatory Genomics (CBCRG) Lab at
    **MBZUAI**. He holds a Master of Science in Bioinformatics from the **University of Birmingham**, and brings
    expertise in bioinformatics pipeline development, genomic data analysis, and machine learning applications in
    computational biology.

    With a background in software development, he combines skills in web development, cloud computing, and machine
    learning to develop robust bioinformatics tools and support high-impact regulatory genomics research. His focus
    is on developing user-friendly applications and pipelines that facilitate diagnostics, personalized medicine,
    and scientific discovery.

