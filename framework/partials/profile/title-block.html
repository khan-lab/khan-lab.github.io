<header id="title-block-header" class="quarto-title-block profile-header">
  <div class="profile-portrait">$profile-portrait$</div>
  <div class="profile-heading">
    <h1 class="title">$title$</h1>
    <p class="profile-role">$profile-role$</p>
    $if(profile-education)$
    <p class="person-education">$profile-education$</p>
    $endif$
    $if(profile-links)$
    <nav class="profile-links" aria-label="External profiles and contact">$profile-links$</nav>
    $endif$
  </div>
</header>
