<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" role="img" aria-labelledby="title desc"><title id="title">Example research workflow</title><desc id="desc">A question leads to evidence and then to shared knowledge.</desc><rect width="480" height="320" rx="16" fill="#f0f3ef"/><g fill="#fafaf8" stroke="#c7cfca"><rect x="60" y="35" width="360" height="60" rx="12"/><rect x="60" y="130" width="360" height="60" rx="12"/><rect x="60" y="225" width="360" height="60" rx="12"/></g><g stroke="#596561" stroke-width="2"><path d="M240 100v24m-6-6 6 6 6-6M240 195v24m-6-6 6 6 6-6" fill="none"/></g><g fill="#202524" font-family="Arial, sans-serif" font-size="21" text-anchor="middle"><text x="240" y="73">Ask a clear question</text><text x="240" y="168">Build and assess evidence</text><text x="240" y="263">Share knowledge and methods</text></g></svg>