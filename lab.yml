lab:
  name: Computational Biology & Cancer Regulatory Genomics Lab
  short_name: CBCRG@MBZUAI
  tagline: Deciphering the cancer genome and epigenome.
  description: We combine multi-omics, machine learning and complete T2T and pangenome references to
    understand gene regulation in development and disease, and we build open, FAIR and AI-ready 
    tools and resources for everyone.
  mission: Understand how the non-coding genome shapes gene regulation in cancer, and build open 
    methods and resources that advance discovery.
  vision: More complete, inclusive and reproducible genomics that advances human health.
  quote:
    text: Science and everyday life cannot and should not be separated.
    author: Rosalind Franklin
  institution: Mohamed bin Zayed University of Artificial Intelligence (MBZUAI)
  email: aziz.khan@mbzuai.ac.ae
  site_url: 'https://khanlab.bio/'
  recruitment_heading: Training the next generation of scientists
  recruitment: We are training and building a collaborative team of responsible researchers united 
    by a shared vision. We are committed to create an inclusive environment and recognize that 
    diversity — in people, ideas, and data — is essential for scientific creativity and discovery.
